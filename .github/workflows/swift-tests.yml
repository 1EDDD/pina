name: Swift and IPA Utility Tests

on:
  push:
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - "tests/**"
      - "tools/inject_dylib.py"
      - ".github/workflows/swift-tests.yml"
  pull_request:
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - "tests/**"
      - "tools/inject_dylib.py"
      - ".github/workflows/swift-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
      - name: Run Swift unit tests
        run: swift test
      - name: Run IPA injector tests
        run: python3 -m unittest discover -s tests -v
