name: Build PinaTV diagnostic binaries

on:
  push:
    paths:
      - "tweak/**"
      - "injected/**"
      - ".github/workflows/theos-build.yml"
  pull_request:
    paths:
      - "tweak/**"
      - "injected/**"
      - ".github/workflows/theos-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Theos toolchain
        uses: waruhachi/theos-action@v2.6.3
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master
          remotelog: false
          libgcuniversal: false
          altlist: false
          comet: false
          orion: false

      - name: Build substrate-free injected dylib
        shell: bash
        working-directory: injected
        run: |
          set -o pipefail
          (set -euo pipefail
           make clean all FINALPACKAGE=1
           output="$(find . -type f -name 'PinaTVLabInjected.dylib' -not -path './theos/*' -not -path './.git/*' -print -quit)"
           if [ -z "$output" ]; then
             echo "PinaTVLabInjected.dylib was not produced."
             find . -type f -name '*.dylib' -not -path './theos/*' -print
             exit 1
           fi
           mkdir -p ../artifacts
           cp "$output" ../artifacts/PinaTVLabInjected.dylib
           file ../artifacts/PinaTVLabInjected.dylib
          ) 2>&1 | tee "$RUNNER_TEMP/theos-build.log"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theos-build-log-${{ github.run_id }}
          path: ${{ runner.temp }}/theos-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload standalone dylib
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PinaTVLabInjected-dylib
          path: artifacts/PinaTVLabInjected.dylib
          if-no-files-found: error
          retention-days: 14

      - name: Build rootless diagnostic package
        working-directory: tweak
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p ../artifacts
          test -n "$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          cp packages/*.deb ../artifacts/

      - name: Upload rootless tweak package
        uses: actions/upload-artifact@v4
        with:
          name: PinaTVLabTweak-rootless
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 14
