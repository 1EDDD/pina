name: Build PinaTV diagnostic binaries

on:
  push:
    paths:
      - "tweak/**"
      - "injected/**"
      - ".github/workflows/theos-build.yml"
  pull_request:
    paths:
      - "tweak/**"
      - "injected/**"
      - ".github/workflows/theos-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Theos officially supports Linux -> iOS builds. This avoids depending on
    # macOS-hosted runners, which were failing before any job step could start.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos and iOS SDKs
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$GITHUB_WORKSPACE/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" 2>&1 | tee "$RUNNER_TEMP/theos-install.log"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/sdks"

      - name: Build substrate-free injected dylib
        shell: bash
        working-directory: injected
        run: |
          set -o pipefail
          (set -euo pipefail
           make clean all FINALPACKAGE=1
           # Theos library.mk versions differ on whether they prefix the product with "lib".
           output="$(find . -type f \( -name 'PinaTVLabInjected.dylib' -o -name 'libPinaTVLabInjected.dylib' \) -not -path './theos/*' -not -path './.git/*' -not -path './artifacts/*' -print -quit)"
           if [ -z "$output" ]; then
             echo "PinaTVLabInjected.dylib was not produced. Candidate dylibs:"
             find . -type f -name '*.dylib' -not -path './theos/*' -not -path './.git/*' -print
             exit 1
           fi
           mkdir -p ../artifacts
           cp "$output" ../artifacts/PinaTVLabInjected.dylib
           file ../artifacts/PinaTVLabInjected.dylib
          ) 2>&1 | tee "$RUNNER_TEMP/theos-injected.log"

      - name: Build rootless diagnostic package
        shell: bash
        working-directory: tweak
        run: |
          set -o pipefail
          (set -euo pipefail
           make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
           output="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
           if [ -z "$output" ]; then
             echo "Theos did not produce a .deb package."
             exit 1
           fi
           mkdir -p ../artifacts
           cp "$output" ../artifacts/PinaTVLabTweak-rootless.deb
           file ../artifacts/PinaTVLabTweak-rootless.deb
          ) 2>&1 | tee "$RUNNER_TEMP/theos-tweak.log"

      - name: Upload build binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PinaTVLab-binaries
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PinaTVLab-build-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/theos-*.log
          if-no-files-found: warn
          retention-days: 7
