name: Build PinaTV diagnostic binaries

on:
  push:
    paths:
      - "tweak/**"
      - "injected/**"
      - ".github/workflows/theos-build.yml"
  pull_request:
    paths:
      - "tweak/**"
      - "injected/**"
      - ".github/workflows/theos-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-injected-dylib:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos toolchain
        uses: waruhachi/theos-action@v2.6.3
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master
          remotelog: false
          libgcuniversal: false
          altlist: false
          comet: false
          orion: false

      - name: Build substrate-free injected dylib
        shell: bash
        working-directory: injected
        run: |
          set -o pipefail
          (set -euo pipefail
           make clean all FINALPACKAGE=1
           # Theos library.mk versions differ on whether they prefix the product with "lib".
           output="$(find . -type f \( -name 'PinaTVLabInjected.dylib' -o -name 'libPinaTVLabInjected.dylib' \) -not -path './theos/*' -not -path './.git/*' -not -path './artifacts/*' -print -quit)"
           if [ -z "$output" ]; then
             echo "PinaTVLabInjected.dylib was not produced. Candidate dylibs:"
             find . -type f -name '*.dylib' -not -path './theos/*' -not -path './.git/*' -print
             exit 1
           fi
           mkdir -p ../artifacts
           cp "$output" ../artifacts/PinaTVLabInjected.dylib
           file ../artifacts/PinaTVLabInjected.dylib
          ) 2>&1 | tee "$RUNNER_TEMP/theos-injected.log"

      - name: Upload standalone dylib
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PinaTVLabInjected-dylib
          path: artifacts/PinaTVLabInjected.dylib
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theos-injected-log-${{ github.run_id }}
          path: ${{ runner.temp }}/theos-injected.log
          if-no-files-found: warn
          retention-days: 7

  build-rootless-tweak:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos toolchain
        uses: waruhachi/theos-action@v2.6.3
        with:
          theos-src: theos/theos
          theos-branch: master
          sdks-src: theos/sdks
          sdks-branch: master
          remotelog: false
          libgcuniversal: false
          altlist: false
          comet: false
          orion: false

      - name: Build rootless diagnostic package
        shell: bash
        working-directory: tweak
        run: |
          set -o pipefail
          (set -euo pipefail
           make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
           output="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
           if [ -z "$output" ]; then
             echo "Theos did not produce a .deb package."
             exit 1
           fi
           mkdir -p ../artifacts
           cp packages/*.deb ../artifacts/
          ) 2>&1 | tee "$RUNNER_TEMP/theos-tweak.log"

      - name: Upload rootless tweak package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PinaTVLabTweak-rootless
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload rootless build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theos-tweak-log-${{ github.run_id }}
          path: ${{ runner.temp }}/theos-tweak.log
          if-no-files-found: warn
          retention-days: 7
